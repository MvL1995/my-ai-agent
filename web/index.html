<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agency Operator</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    /* Hallmark · genre: modern-minimal · macrostructure: Workbench · theme: Cobalt · enrichment: none · nav: N9 · footer: Ft2 */
    /* Hallmark · pre-emit critique: P5 H4 E5 S4 R5 V5 */
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: clip; }
    body {
      background: var(--color-paper-2);
      color: var(--color-ink);
      font-family: var(--font-body);
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button, input, select, textarea { min-width: 0; }
    button { min-height: 2.75rem; }
    :focus-visible {
      outline: 0.125rem solid var(--color-focus);
      outline-offset: 0.125rem;
    }
    .shell { width: min(100%, 96rem); margin-inline: auto; padding: var(--space-4); }
    .topbar {
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      border-bottom: 0.0625rem solid var(--color-rule);
    }
    .brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .brand-mark {
      width: 0.75rem;
      height: 0.75rem;
      flex: 0 0 auto;
      background: var(--color-accent);
      border-radius: 50%;
    }
    .brand strong {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }
    .local-status { color: var(--color-muted); font-family: var(--font-mono); font-size: 0.75rem; }
    .workbench {
      display: grid;
      grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.6fr) minmax(14rem, 0.75fr);
      gap: var(--space-4);
      padding-block: var(--space-4);
      align-items: start;
    }
    .panel {
      min-width: 0;
      background: var(--color-paper);
      border: 0.0625rem solid var(--color-rule);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-panel);
    }
    .panel-head { padding: var(--space-4); border-bottom: 0.0625rem solid var(--color-rule); }
    .eyebrow {
      margin: 0 0 var(--space-1);
      color: var(--color-accent);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1, h2, h3 { margin: 0; font-family: var(--font-display); line-height: 1.2; overflow-wrap: anywhere; }
    h1 { font-size: clamp(1.25rem, 2.2vw, 1.75rem); }
    h2 { font-size: 1rem; }
    h3 { font-size: 0.9375rem; }
    .panel-body { padding: var(--space-4); }
    .field { display: grid; gap: var(--space-2); margin-bottom: var(--space-4); }
    label { font-size: 0.8125rem; font-weight: 700; }
    input, select, textarea {
      width: 100%;
      border: 0.0625rem solid var(--color-rule);
      border-radius: var(--radius-sm);
      outline: 0.125rem solid transparent;
      outline-offset: 0.0625rem;
      background: var(--color-paper);
      color: var(--color-ink);
      padding: var(--space-3);
    }
    input, select { min-height: 2.75rem; }
    textarea { min-height: 8rem; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--color-muted); }
    input:focus-visible, select:focus-visible, textarea:focus-visible { outline-color: var(--color-focus); }
    input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--color-error); }
    .helper { min-height: 1lh; margin: 0; color: var(--color-muted); font-size: 0.75rem; }
    .primary {
      width: 100%;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--color-accent);
      color: var(--color-accent-ink);
      padding: var(--space-3) var(--space-4);
      font-weight: 750;
      cursor: pointer;
    }
    .primary:active { background: var(--color-accent-hover); transform: translateY(0.0625rem); }
    .primary:disabled { opacity: 0.55; cursor: not-allowed; }
    #workflow-decision[data-risk="high"] { color: var(--color-error); font-weight: 700; }
    #retry-button[data-risk="high"] { background: var(--color-error); }
    .form-message { min-height: 1.5em; margin: var(--space-3) 0 0; color: var(--color-muted); font-size: 0.8125rem; }
    .form-message[data-state="error"] { color: var(--color-error); }
    .form-message[data-state="success"] { color: var(--color-success); }
    .status-row { display: flex; align-items: center; gap: var(--space-2); }
    .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--color-muted); }
    .status-dot[data-status="completed"] { background: var(--color-success); }
    .status-dot[data-status="failed"] { background: var(--color-error); }
    .output {
      min-height: 9rem;
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--color-ink-2);
    }
    .steps { display: grid; gap: var(--space-3); margin-top: var(--space-5); }
    .step { border-top: 0.0625rem solid var(--color-rule); padding-top: var(--space-3); }
    .step-meta { color: var(--color-muted); font-family: var(--font-mono); font-size: 0.6875rem; }
    .step p { margin: var(--space-2) 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .preview { margin-top: var(--space-5); border-top: 0.0625rem solid var(--color-rule); padding-top: var(--space-4); }
    .preview h3 { margin-bottom: var(--space-3); }
    .preview-frame {
      display: block;
      width: 100%;
      min-height: 30rem;
      border: 0.0625rem solid var(--color-rule);
      border-radius: var(--radius-sm);
      background: white;
    }
    .preview-frame[hidden] { display: none; }
    .download-button { margin-top: var(--space-3); }
    .history, .attempts { display: grid; gap: var(--space-2); }
    .attempts { margin-top: var(--space-3); }
    .history button, .attempts button {
      width: 100%;
      border: 0.0625rem solid var(--color-rule);
      border-radius: var(--radius-sm);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: var(--space-3);
      text-align: left;
      cursor: pointer;
    }
    .attempts button[aria-current="true"] { border-color: var(--color-accent); background: var(--color-paper-2); }
    .history strong, .history span { display: block; overflow-wrap: anywhere; }
    .history span { margin-top: var(--space-1); color: var(--color-muted); font-family: var(--font-mono); font-size: 0.6875rem; }
    .retry-metrics { margin-bottom: var(--space-3); line-height: 1.6; }
    .rollback-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-bottom: var(--space-3); }
    .rollback-actions[hidden] { display: none; }
    #rollback-reject { border: 0.0625rem solid var(--color-rule); border-radius: var(--radius-sm); background: var(--color-paper); color: var(--color-ink); cursor: pointer; }
    .empty { color: var(--color-muted); font-size: 0.875rem; }
    .foot-line { border-top: 0.0625rem solid var(--color-rule); color: var(--color-muted); font-size: 0.75rem; }
    .foot-line p { margin: 0; padding-block: var(--space-4); }
    @media (hover: hover) {
      .primary:hover { background: var(--color-accent-hover); }
      .history button:hover, .attempts button:hover { background: var(--color-paper-2); }
    }
    @media (max-width: 64rem) {
      .workbench { grid-template-columns: minmax(15rem, 0.8fr) minmax(0, 1.4fr); }
      .history-panel { grid-column: 1 / -1; }
      .history { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 44rem) {
      .shell { padding: var(--space-3); }
      .workbench { grid-template-columns: minmax(0, 1fr); }
      .history-panel { grid-column: auto; }
      .history { grid-template-columns: minmax(0, 1fr); }
      .local-status { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>AI Agency Operator</strong></div>
      <span class="local-status">LOCAL · 127.0.0.1</span>
    </header>

    <main class="workbench">
      <section class="panel" aria-labelledby="brief-title">
        <div class="panel-head"><p class="eyebrow">01 · Brief</p><h1 id="brief-title">提交客户任务</h1></div>
        <form class="panel-body" id="client-form">
          <div class="field">
            <label for="company-name">公司名称</label>
            <input id="company-name" name="company_name" required placeholder="例：Alpha Studio">
          </div>
          <div class="field">
            <label for="target-customer">目标客户</label>
            <input id="target-customer" name="target_customer" required placeholder="例：马来西亚中小企业">
          </div>
          <div class="field">
            <label for="core-service">核心服务</label>
            <input id="core-service" name="core_service" required placeholder="例：AI 网站与数字广告">
          </div>
          <div class="field">
            <label for="region">地区</label>
            <input id="region" name="region" required placeholder="例：马来西亚">
          </div>
          <div class="field">
            <label for="language">网站语言</label>
            <select id="language" name="language" required>
              <option value="">请选择</option>
              <option value="Chinese">中文</option>
              <option value="English">English</option>
              <option value="Chinese and English">中英双语</option>
            </select>
          </div>
          <div class="field">
            <label for="cta">行动号召</label>
            <input id="cta" name="cta" required placeholder="例：预约免费咨询">
          </div>
          <div class="field">
            <label for="contact">联系方式</label>
            <input id="contact" name="contact" required placeholder="电话、WhatsApp、电邮或网址">
          </div>
          <button class="primary" id="submit-button" type="submit">开始执行</button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="result-title">
        <div class="panel-head">
          <p class="eyebrow">02 · Delivery</p>
          <div class="status-row"><span class="status-dot" id="status-dot" aria-hidden="true"></span><h2 id="result-title">执行结果</h2></div>
        </div>
        <div class="panel-body">
          <p class="output" id="final-output">提交任务后，最终结果会显示在这里。</p>
          <p class="step-meta" id="workflow-diagnostics"></p>
          <p class="step-meta" id="workflow-lineage"></p>
          <p class="step-meta" id="workflow-decision" role="status" aria-live="polite"></p>
          <div class="attempts" id="workflow-attempts" aria-label="重跑链对比"></div>
          <button class="primary" id="retry-button" type="button" hidden>重新执行失败任务</button>
          <div class="steps" id="result-steps" aria-label="Agent 执行步骤"></div>
          <section class="preview" aria-labelledby="preview-title">
            <h3 id="preview-title">Landing Page 预览</h3>
            <p class="empty" id="preview-empty">暂无可预览网页。</p>
            <iframe
              class="preview-frame"
              id="preview-frame"
              title="生成的 Landing Page 预览"
              sandbox="allow-scripts"
              hidden
            ></iframe>
            <button class="primary download-button" id="download-button" type="button" hidden>下载网站 ZIP</button>
          </section>
        </div>
      </section>

      <aside class="panel history-panel" aria-labelledby="history-title">
        <div class="panel-head"><p class="eyebrow">03 · Runs</p><h2 id="history-title">最近任务</h2></div>
        <div class="panel-body">
          <div class="retry-metrics step-meta" id="retry-metrics" aria-label="重跑成效">正在载入重跑成效…</div>
          <div
            class="retry-metrics step-meta" id="override-breakdown"
            aria-label="人工覆盖细分" role="status" aria-live="polite"
          >正在载入人工覆盖细分…</div>
          <div class="rollback-actions" id="rollback-actions" aria-label="回退审批" hidden>
            <button class="primary" id="rollback-approve" type="button">批准并执行回退</button>
            <button id="rollback-reject" type="button">保留当前值</button>
          </div>
          <div class="rollback-actions" id="restoration-actions" aria-label="恢复审批" hidden>
            <button class="primary" id="restoration-approve" type="button">批准并执行恢复</button>
            <button id="restoration-reject" type="button">暂不恢复</button>
          </div>
          <div class="rollback-actions" id="reset-actions" aria-label="策略重置审批" hidden>
            <button class="primary" id="reset-approve" type="button">批准策略重置并解冻</button>
            <button id="reset-reject" type="button">继续冻结</button>
          </div>
          <div class="history" id="history-list"><p class="empty">正在载入记录…</p></div>
        </div>
      </aside>
    </main>

    <footer class="foot-line"><p>AI Web &amp; Advertising Agency OS · Local operator console</p></footer>
  </div>

  <script>
    const form = document.querySelector("#client-form");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#form-message");
    const output = document.querySelector("#final-output");
    const diagnostics = document.querySelector("#workflow-diagnostics");
    const lineage = document.querySelector("#workflow-lineage");
    const decision = document.querySelector("#workflow-decision");
    const attemptList = document.querySelector("#workflow-attempts");
    const steps = document.querySelector("#result-steps");
    const history = document.querySelector("#history-list");
    const retryMetrics = document.querySelector("#retry-metrics");
    const overrideBreakdown = document.querySelector("#override-breakdown");
    const rollbackActions = document.querySelector("#rollback-actions");
    const rollbackApprove = document.querySelector("#rollback-approve");
    const rollbackReject = document.querySelector("#rollback-reject");
    const restorationActions = document.querySelector("#restoration-actions");
    const restorationApprove = document.querySelector("#restoration-approve");
    const restorationReject = document.querySelector("#restoration-reject");
    const resetActions = document.querySelector("#reset-actions");
    const resetApprove = document.querySelector("#reset-approve");
    const resetReject = document.querySelector("#reset-reject");
    const statusDot = document.querySelector("#status-dot");
    const previewEmpty = document.querySelector("#preview-empty");
    const previewFrame = document.querySelector("#preview-frame");
    const downloadButton = document.querySelector("#download-button");
    const retryButton = document.querySelector("#retry-button");
    let downloadableWorkflowId = null;
    let retryableWorkflowId = null;
    let retryOverrideRequired = false;
    let retryOverrideWarning = "";
    let retryOverrideRiskLevel = "";
    let pendingRollback = null;
    let pendingRestoration = null;
    let pendingReset = null;
    const failureLabels = {
      transient: "临时故障",
      external_dependency: "外部依赖",
      validation: "输出校验",
      configuration: "配置或权限",
      execution: "执行异常",
    };

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "请求失败。");
      return data;
    }

    async function waitForJob(jobId) {
      while (true) {
        const job = await api(`/api/jobs/${encodeURIComponent(jobId)}`);
        if (job.status !== "running") return job;
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
    }

    function renderLandingPagePreview(landingPage, workflowId = null) {
      previewFrame.removeAttribute("srcdoc");
      previewFrame.hidden = true;
      previewEmpty.hidden = false;
      downloadableWorkflowId = null;
      downloadButton.hidden = true;

      const files = landingPage && landingPage.files;
      const requiredFiles = ["index.html", "styles.css", "script.js"];
      if (!files || !requiredFiles.every((name) => typeof files[name] === "string")) return;

      try {
        const document = new DOMParser().parseFromString(files["index.html"], "text/html");
        const policy = document.createElement("meta");
        policy.httpEquiv = "Content-Security-Policy";
        policy.content = "default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'";

        const style = document.createElement("style");
        style.textContent = files["styles.css"];
        const script = document.createElement("script");
        script.textContent = files["script.js"];

        document.head.prepend(policy);
        document.head.append(style);
        document.body.append(script);
        previewFrame.srcdoc = `<!doctype html>\n${document.documentElement.outerHTML}`;
        previewFrame.hidden = false;
        previewEmpty.hidden = true;
        if (typeof workflowId === "string" && workflowId) {
          downloadableWorkflowId = workflowId;
          downloadButton.hidden = false;
        }
      } catch (error) {
        console.error("Landing page preview failed.", error);
      }
    }

    function renderRun(run) {
      output.textContent = run.final_output || run.error || "没有返回内容。";
      const duration = Math.round(Number(run.duration_ms) || 0);
      diagnostics.textContent = `总耗时：${duration} ms` + (
        run.failed_stage ? ` · 失败阶段：${run.failed_stage}` : ""
      );
      const attemptNumber = Number(run.attempt_number) || 1;
      lineage.textContent = `尝试次数：${attemptNumber}` + (
        run.retry_of ? ` · 来源：${run.retry_of}` : ""
      ) + (
        run.override_reason ? ` · 人工覆盖：${run.override_reason}` : ""
      );
      attemptList.replaceChildren();
      const overrideRiskLevel = run.override_risk_level || "";
      decision.dataset.risk = overrideRiskLevel;
      decision.textContent = run.status === "failed"
        ? `失败类型：${failureLabels[run.failure_type] || "未知"} · `
          + (run.recommended_action || "先检查失败详情。")
          + (run.override_risk_warning
            ? ` · 人工覆盖风险（${overrideRiskLevel === "high" ? "高" : "中"}）：`
              + run.override_risk_warning : "")
        : "";
      for (const attempt of run.attempts || []) {
        const item = document.createElement("button");
        item.type = "button";
        item.textContent = `第${Number(attempt.attempt_number) || 1}次 · ${attempt.status || "unknown"}`
          + ` · ${Math.round(Number(attempt.duration_ms) || 0)} ms`
          + (attempt.failed_stage ? ` · 失败：${attempt.failed_stage}` : "")
          + (attempt.override_reason ? ` · 人工覆盖：${attempt.override_reason}` : "");
        item.setAttribute("aria-current", String(attempt.workflow_id === run.workflow_id));
        item.addEventListener("click", () => loadRun(attempt.workflow_id));
        attemptList.append(item);
      }
      statusDot.dataset.status = run.status || "";
      retryableWorkflowId = run.status === "failed"
        && (run.retry_recommended || run.policy_adjusted)
        ? run.workflow_id : null;
      retryOverrideRequired = Boolean(retryableWorkflowId && run.policy_adjusted);
      retryButton.textContent = retryOverrideRequired
        ? (overrideRiskLevel === "high"
          ? "高风险人工覆盖并重跑" : "人工覆盖并重跑")
        : "重新执行失败任务";
      retryOverrideWarning = retryOverrideRequired
        ? (run.override_risk_warning || "") : "";
      retryOverrideRiskLevel = retryOverrideRequired ? overrideRiskLevel : "";
      retryButton.dataset.risk = retryOverrideRiskLevel;
      retryButton.hidden = !retryableWorkflowId;
      steps.replaceChildren();
      for (const item of run.steps || []) {
        const article = document.createElement("article");
        article.className = "step";
        const title = document.createElement("h3");
        title.textContent = item.agent_name || "Agent";
        const meta = document.createElement("div");
        meta.className = "step-meta";
        meta.textContent = `${item.status || "unknown"} · `
          + `${item.task_id || "no-id"} · `
          + `${Math.round(Number(item.duration_ms) || 0)} ms`;
        const body = document.createElement("p");
        body.textContent = item.output || item.error || "没有输出。";
        article.append(title, meta, body);
        steps.append(article);
      }
      renderLandingPagePreview(
        run.status === "completed" ? run.landing_page : null,
        run.workflow_id,
      );
    }

    async function loadRun(workflowId) {
      try { renderRun(await api(`/api/workflows/${encodeURIComponent(workflowId)}`)); }
      catch (error) {
        renderLandingPagePreview(null);
        attemptList.replaceChildren();
        output.textContent = error.message;
        statusDot.dataset.status = "failed";
        retryableWorkflowId = null;
        retryOverrideRequired = false;
        decision.textContent = "";
        retryButton.hidden = true;
        retryOverrideWarning = "";
        retryOverrideRiskLevel = "";
        decision.dataset.risk = "";
        retryButton.dataset.risk = "";
      }
    }

    async function loadHistory() {
      try {
        const data = await api("/api/workflows");
        const metrics = data.retry_metrics || {};
        const chains = Number(metrics.retry_chains) || 0;
        const recovered = Number(metrics.recovered_chains) || 0;
        const recommendations = Number(metrics.retry_recommendations) || 0;
        const accepted = Number(metrics.accepted_recommendations) || 0;
        const hits = Number(metrics.recommendation_hits) || 0;
        const overrides = Number(metrics.manual_overrides) || 0;
        const successfulOverrides = Number(metrics.successful_overrides) || 0;
        const riskWarnings = Number(metrics.risk_warnings) || 0;
        const riskOverrides = Number(metrics.risk_warning_overrides) || 0;
        const riskRecoveries = Number(metrics.risk_warning_recoveries) || 0;
        const minimumSamples = Number(metrics.minimum_decision_samples) || 3;
        const adoption = metrics.recommendation_adoption_rate == null
          ? `暂无（${recommendations} 条建议）`
          : `${metrics.recommendation_adoption_rate}%（${accepted}/${recommendations}）`;
        const hitRate = metrics.decision_hit_rate == null
          ? `暂无（${accepted} 条采纳）`
          : `${metrics.decision_hit_rate}%（${hits}/${accepted}）`;
        const overrideRate = metrics.override_success_rate == null
          ? `暂无（${overrides} 次覆盖）`
          : `${metrics.override_success_rate}%（${successfulOverrides}/${overrides}）`;
        const riskAdoption = metrics.risk_warning_adoption_rate == null
          ? `暂无（${riskWarnings} 次提示）`
          : `${metrics.risk_warning_adoption_rate}%（${riskOverrides}/${riskWarnings}）`;
        const riskRecovery = metrics.risk_warning_recovery_rate == null
          ? `暂无（${riskOverrides} 次覆盖）`
          : `${metrics.risk_warning_recovery_rate}%（${riskRecoveries}/${riskOverrides}）`;

        const lowestHit = (metrics.decision_breakdown || []).find(
          (item) => item.sample_sufficient && item.hit_rate != null
        );
        const lowHitText = lowestHit
          ? `${failureLabels[lowestHit.failure_type] || lowestHit.failure_type} / `
            + `${lowestHit.failed_stage || "未知阶段"}：${lowestHit.hit_rate}%`
            + `（${lowestHit.hits}/${lowestHit.accepted}）`
          : `暂无可信分组（每组至少 ${minimumSamples} 次采纳）`;
        const overrideGroups = metrics.override_breakdown || [];
        const detailedOverride = overrideGroups.find(
          (item) => item.sample_sufficient
        ) || overrideGroups[0];
        const overrideText = detailedOverride
          ? `${detailedOverride.sample_sufficient ? "可信低效覆盖" : "人工覆盖样本不足"}：`
            + `${failureLabels[detailedOverride.failure_type] || detailedOverride.failure_type} / `
            + `${detailedOverride.failed_stage || "未知阶段"} · 成功率 `
            + `${detailedOverride.success_rate}%（${detailedOverride.successful}/${detailedOverride.overrides}）`
          : "人工覆盖细分：暂无样本。";
        const warningGroups = metrics.risk_warning_breakdown || [];
        const detailedWarning = warningGroups.find(
          (item) => item.sample_sufficient
        ) || warningGroups[0];
        const warningRecovery = detailedWarning && detailedWarning.recovery_rate != null
          ? `覆盖后恢复率 ${detailedWarning.recovery_rate}%`
            + `（${detailedWarning.recoveries}/${detailedWarning.overrides}）`
          : `覆盖后恢复率 暂无（${detailedWarning ? detailedWarning.overrides : 0} 次覆盖）`;
        const warningText = detailedWarning
          ? `${detailedWarning.sample_sufficient ? "可信提示效果" : "提示效果样本不足"}：`
            + `${failureLabels[detailedWarning.failure_type] || detailedWarning.failure_type} / `
            + `${detailedWarning.failed_stage || "未知阶段"} · 继续覆盖率 `
            + `${detailedWarning.adoption_rate}%`
            + `（${detailedWarning.overrides}/${detailedWarning.warnings}） · ${warningRecovery}`
          : "风险提示分组：暂无样本。";
        const transitions = metrics.risk_level_transitions || [];
        const latestTransition = transitions[transitions.length - 1];
        const transitionText = latestTransition
          ? `最近等级变更：${failureLabels[latestTransition.failure_type] || latestTransition.failure_type} / `
            + `${latestTransition.failed_stage || "未知阶段"} · ${latestTransition.from_level === "high" ? "高" : "中"}→${latestTransition.to_level === "high" ? "高" : "中"} · ${latestTransition.workflow_id}`
          : "风险等级稳定：暂无升降。";
        const jitterRate = detailedWarning && detailedWarning.jitter_rate != null
          ? `${detailedWarning.jitter_rate}%（${detailedWarning.jitters}/${detailedWarning.level_changes}）`
          : "暂无";
        const stabilityText = detailedWarning
          ? `等级变更率 ${detailedWarning.change_rate}%（${detailedWarning.level_changes}/${detailedWarning.risk_events}）`
            + ` · 等级抖动率 ${jitterRate} · 滞回区间 ${detailedWarning.hysteresis} 个百分点`
            + `${detailedWarning.hysteresis_calibrated ? "（已校准）" : "（基线）"}`
          : "等级稳定性：暂无样本。";
        const calibration = detailedWarning && detailedWarning.calibration_effectiveness;
        const calibrationText = !calibration
          ? "校准效果：未触发"
          : !calibration.sample_sufficient
            ? `校准效果：观察中（校准后 ${calibration.after.events}/${minimumSamples} 个风险事件）`
            : `校准效果：${calibration.effective ? "有效" : "未改善"} · 抖动事件率 `
              + `${calibration.before.jitter_event_rate}%→${calibration.after.jitter_event_rate}% · 变更率 `
              + `${calibration.before.change_rate}%→${calibration.after.change_rate}%`;
        const rollback = (metrics.ineffective_calibration_breakdown || [])[0];
        const rollbackAudit = (metrics.hysteresis_rollback_audit || [])[0];
        pendingRollback = rollback && rollback.rollback_status !== "completed"
          ? rollback : null;
        rollbackActions.hidden = !pendingRollback;
        const rollbackText = !rollback
          ? rollbackAudit
            ? `最近回退审计：${rollbackAudit.decision === "approved" ? "批准" : "拒绝"} · `
              + `${rollbackAudit.execution_status === "completed" ? "已执行" : "未执行"} · `
              + `当前 ${rollbackAudit.result_hysteresis} 个百分点 · ${rollbackAudit.reason} · ${rollbackAudit.decided_at}`
            : "受控回退：暂无可信无效组。"
          : rollback.rollback_status === "completed"
            ? `回退已执行：当前滞回值 ${rollback.current_hysteresis} 个百分点 · `
              + `${rollback.decision_reason} · ${rollback.decided_at}`
            : rollback.rollback_status === "rejected"
              ? `回退已拒绝：当前保持 ${rollback.current_hysteresis} 个百分点 · `
                + `${rollback.decision_reason}（可重新审批）`
              : `可信校准无效：${failureLabels[rollback.failure_type] || rollback.failure_type} / `
                + `${rollback.failed_stage || "未知阶段"} · 受控回退 ${rollback.current_hysteresis}→${rollback.target_hysteresis} 个百分点`
                + "（需人工确认，当前保持不变）";
        const rollbackEffect = (
          rollback && rollback.rollback_effectiveness
        ) || (rollbackAudit && rollbackAudit.effectiveness);
        const rollbackEffectText = !rollbackEffect
          ? "回退效果：未执行"
          : !rollbackEffect.sample_sufficient
            ? `回退效果：观察中（回退后 ${rollbackEffect.after.events}/${minimumSamples} 个风险事件）`
            : `${rollbackEffect.effective ? "回退效果：有效" : "回退效果：无效"} · 回退后变更率 `
              + `${rollbackEffect.before.change_rate}%→${rollbackEffect.after.change_rate}% · 回退后抖动事件率 `
              + `${rollbackEffect.before.jitter_event_rate}%→${rollbackEffect.after.jitter_event_rate}%`;
        const restoration = (
          metrics.ineffective_rollback_breakdown || []
        )[0];
        const restorationAudit = (
          metrics.hysteresis_restoration_audit || []
        )[0];
        pendingRestoration = (
          restoration && restoration.restoration_status !== "completed"
        ) ? restoration : null;
        restorationActions.hidden = !pendingRestoration;
        const restorationText = !restoration
          ? restorationAudit
            ? `最近恢复审计：${restorationAudit.decision === "approved" ? "批准" : "拒绝"} · `
              + `${restorationAudit.execution_status === "completed" ? "已执行" : "未执行"} · `
              + `当前 ${restorationAudit.result_hysteresis} 个百分点 · ${restorationAudit.reason} · ${restorationAudit.decided_at}`
            : "恢复建议：暂无可信无效回退组。"
          : restoration.restoration_status === "completed"
            ? `恢复已执行：当前滞回值 ${restoration.current_hysteresis} 个百分点 · `
              + `${restoration.decision_reason} · ${restoration.decided_at}`
            : restoration.restoration_status === "rejected"
              ? `恢复已拒绝：当前保持 ${restoration.current_hysteresis} 个百分点 · `
                + `${restoration.decision_reason}（可重新审批）`
              : `可信回退无效：${failureLabels[restoration.failure_type] || restoration.failure_type} / `
                + `${restoration.failed_stage || "未知阶段"} · 建议恢复 `
                + `${restoration.current_hysteresis}→${restoration.target_hysteresis} 个百分点`
                + "（需人工审批，当前保持不变）";
        const restorationEffect = (
          restoration && restoration.restoration_effectiveness
        ) || (restorationAudit && restorationAudit.effectiveness);
        const restorationEffectText = !restorationEffect
          ? "恢复效果：未执行"
          : !restorationEffect.sample_sufficient
            ? `恢复效果：观察中（恢复后 ${restorationEffect.after.events}/${minimumSamples} 个风险事件）`
            : `${restorationEffect.effective ? "恢复效果：有效" : "恢复效果：无效"} · 恢复后变更率 `
              + `${restorationEffect.before.change_rate}%→${restorationEffect.after.change_rate}% · 恢复后抖动事件率 `
              + `${restorationEffect.before.jitter_event_rate}%→${restorationEffect.after.jitter_event_rate}%`;
        const cycleGroup = (
          metrics.ineffective_restoration_breakdown || []
        )[0];
        const resetAudit = (metrics.hysteresis_reset_audit || [])[0];
        pendingReset = (
          cycleGroup && cycleGroup.cycle_status === "blocked"
          && cycleGroup.reset_status !== "completed"
        ) ? cycleGroup : null;
        resetActions.hidden = !pendingReset;
        const cycleText = !cycleGroup
          ? resetAudit
            ? `最近策略重置审计：${resetAudit.decision === "approved" ? "批准" : "拒绝"} · `
              + `${resetAudit.execution_status === "completed" ? "已执行" : "未执行"} · ${resetAudit.reason} · ${resetAudit.decided_at}`
            : "策略循环：暂无冻结组。"
          : cycleGroup.cycle_status === "released"
            ? `最近策略重置审计：批准 · 已执行 · 策略循环已解冻，当前保持 `
              + `${cycleGroup.current_hysteresis} 个百分点 · ${cycleGroup.decision_reason} · ${cycleGroup.decided_at}`
            : cycleGroup.reset_status === "rejected"
              ? `策略重置已拒绝：继续冻结 ${failureLabels[cycleGroup.failure_type] || cycleGroup.failure_type} / `
                + `${cycleGroup.failed_stage || "未知阶段"} · ${cycleGroup.decision_reason}（可重新审批）`
              : `可信恢复无效：${failureLabels[cycleGroup.failure_type] || cycleGroup.failure_type} / `
                + `${cycleGroup.failed_stage || "未知阶段"} · 策略循环已阻止`
                + `（需人工复核，当前保持 ${cycleGroup.current_hysteresis} 个百分点）`;
        const resetEffect = (cycleGroup && cycleGroup.reset_effectiveness)
          || (resetAudit && resetAudit.effectiveness);
        const resetEffectText = !resetEffect
          ? "解冻表现：未执行"
          : !resetEffect.sample_sufficient
            ? `解冻表现：观察中（解冻后 ${resetEffect.after.events}/${minimumSamples} 个风险事件）`
            : `${resetEffect.effective ? "解冻表现：稳定" : "解冻表现：需复核"} · 解冻后变更率 `
              + `${resetEffect.before.change_rate}%→${resetEffect.after.change_rate}% · 解冻后抖动事件率 `
              + `${resetEffect.before.jitter_event_rate}%→${resetEffect.after.jitter_event_rate}%`;
        const refreeze = (metrics.ineffective_reset_breakdown || [])[0];
        const refreezeText = !refreeze
          ? "重新冻结建议：暂无可信解冻后恶化组。"
          : `可信解冻后恶化：${failureLabels[refreeze.failure_type] || refreeze.failure_type} / `
            + `${refreeze.failed_stage || "未知阶段"} · 建议重新冻结`
            + "（需人工审批，当前仍保持解冻） · 解冻后变更率 "
            + `${refreeze.before_change_rate}%→${refreeze.after_change_rate}% · 解冻后抖动事件率 `
            + `${refreeze.before_jitter_event_rate}%→${refreeze.after_jitter_event_rate}%`;
        overrideBreakdown.textContent = `${overrideText} · ${warningText} · ${stabilityText} · ${calibrationText} · ${rollbackText} · ${rollbackEffectText} · ${restorationText} · ${restorationEffectText} · ${cycleText} · ${resetEffectText} · ${refreezeText} · ${transitionText}`;
        const recovery = metrics.recovery_rate == null
          ? `暂无（${chains} 条重跑链）`
          : `${metrics.recovery_rate}%（${recovered}/${chains}）`;
        const durationChange = metrics.average_duration_change_ms == null
          ? "暂无"
          : `${Math.round(Number(metrics.average_duration_change_ms))} ms`
            + `（${Number(metrics.duration_samples) || 0} 条链）`;
        const globalLevelChangeRate = metrics.risk_level_change_rate == null
          ? "暂无"
          : `${metrics.risk_level_change_rate}%（${metrics.risk_level_changes}/${metrics.risk_level_events}）`;
        const globalLevelJitterRate = metrics.risk_level_jitter_rate == null
          ? "暂无"
          : `${metrics.risk_level_jitter_rate}%（${metrics.risk_level_jitters}/${metrics.risk_level_changes}）`;
        retryMetrics.textContent = `建议采纳率：${adoption} · 决策命中率：${hitRate}`
          + ` · 链恢复率：${recovery} · 平均耗时变化：${durationChange}`
          + ` · 可信低命中：${lowHitText}`
          + ` · 人工覆盖成功率：${overrideRate}`
          + ` · 高频失败：${metrics.top_failed_stage || "暂无"}`
          + ` · 风险提示后覆盖率：${riskAdoption}`
          + ` · 提示后覆盖恢复率：${riskRecovery}`
          + ` · 全局等级变更率：${globalLevelChangeRate}`
          + ` · 全局等级抖动率：${globalLevelJitterRate}`;
        history.replaceChildren();
        if (!data.runs.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "还没有任务记录。提交第一份客户 Brief 即可开始。";
          history.append(empty);
          return;
        }
        for (const run of data.runs) {
          const item = document.createElement("button");
          item.type = "button";
          const title = document.createElement("strong");
          title.textContent = run.objective;
          const meta = document.createElement("span");
          const attempt = Number(run.attempt_number) || 1;
          meta.textContent = `${run.status} · 第${attempt}次 · ${run.created_at}`;
          item.append(title, meta);
          item.addEventListener("click", () => loadRun(run.workflow_id));
          history.append(item);
        }
      } catch (error) {
        retryMetrics.textContent = "重跑成效暂不可用。";
        overrideBreakdown.textContent = "人工覆盖细分暂不可用。";
        pendingRollback = null;
        rollbackActions.hidden = true;
        pendingRestoration = null;
        restorationActions.hidden = true;
        pendingReset = null;
        resetActions.hidden = true;
        history.innerHTML = "";
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = error.message;
        history.append(empty);
      }
    }

    async function decideHysteresis(action, decisionValue) {
      const isReset = action === "reset";
      const isRestoration = action === "restoration";
      const pending = isReset ? pendingReset
        : isRestoration ? pendingRestoration : pendingRollback;
      if (!pending) return;
      const promptText = isReset
        ? decisionValue === "approved"
          ? "请输入策略重置审批原因（必填，最多 200 字）"
          : "请输入继续冻结的原因（必填，最多 200 字）"
        : isRestoration
          ? decisionValue === "approved"
            ? "请输入恢复审批原因（必填，最多 200 字）"
            : "请输入暂不恢复的原因（必填，最多 200 字）"
          : decisionValue === "approved"
            ? "请输入回退审批原因（必填，最多 200 字）"
            : "请输入保留当前值的原因（必填，最多 200 字）";
      const reason = window.prompt(promptText);
      if (reason === null) return;
      if (!reason.trim()) {
        message.dataset.state = "error";
        message.textContent = isReset
          ? "策略重置审批原因不能为空。"
          : isRestoration
            ? "恢复审批原因不能为空。"
            : "回退审批原因不能为空。";
        return;
      }

      const approve = isReset ? resetApprove
        : isRestoration ? restorationApprove : rollbackApprove;
      const reject = isReset ? resetReject
        : isRestoration ? restorationReject : rollbackReject;
      approve.disabled = true;
      reject.disabled = true;
      try {
        const result = await api(`/api/retry-risk/${action}`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            failure_type: pending.failure_type,
            failed_stage: pending.failed_stage,
            decision: decisionValue,
            reason: reason.trim(),
          }),
        });
        message.dataset.state = "success";
        message.textContent = result.execution_status === "completed"
          ? isReset
            ? "策略重置已执行，策略循环已解冻，当前滞回值为 "
              + result.result_hysteresis + " 个百分点。"
            : isRestoration
              ? "恢复已执行，当前滞回值为 "
                + result.result_hysteresis + " 个百分点。"
              : "回退已执行，当前滞回值为 "
                + result.result_hysteresis + " 个百分点。"
          : isReset
            ? "已记录继续冻结的决定。"
            : isRestoration
              ? "已记录暂不恢复的决定。"
              : "已记录保留当前滞回值的决定。";
        await loadHistory();
      } catch (error) {
        message.dataset.state = "error";
        message.textContent = error.message;
      } finally {
        approve.disabled = false;
        reject.disabled = false;
      }
    }

    rollbackApprove.addEventListener(
      "click", () => decideHysteresis("rollback", "approved")
    );
    resetApprove.addEventListener(
      "click", () => decideHysteresis("reset", "approved")
    );
    resetReject.addEventListener(
      "click", () => decideHysteresis("reset", "rejected")
    );
    rollbackReject.addEventListener(
      "click", () => decideHysteresis("rollback", "rejected")
    );
    restorationApprove.addEventListener(
      "click", () => decideHysteresis("restoration", "approved")
    );
    restorationReject.addEventListener(
      "click", () => decideHysteresis("restoration", "rejected")
    );


    retryButton.addEventListener("click", async () => {
      if (!retryableWorkflowId) return;

      const isOverride = retryOverrideRequired;
      const requestOptions = {method: "POST"};
      if (isOverride) {
        const overrideWarning = retryOverrideWarning;
        const confirmation = retryOverrideRiskLevel === "high"
          ? `${overrideWarning} 这是高风险操作，仍要人工覆盖吗？`
          : `${overrideWarning} 仍要人工覆盖吗？`;
        if (
          overrideWarning
          && !window.confirm(confirmation)
        ) {
          return;
        }
        const reason = window.prompt("请输入人工覆盖原因（必填，最多 200 字）");
        if (reason === null) return;
        if (!reason.trim()) {
          message.dataset.state = "error";
          message.textContent = "人工覆盖原因不能为空。";
          return;
        }
        requestOptions.headers = {"Content-Type": "application/json"};
        requestOptions.body = JSON.stringify({override_reason: reason.trim()});
      }

      retryButton.disabled = true;
      message.dataset.state = "";
      message.textContent = isOverride
        ? "正在执行人工覆盖重跑。"
        : "正在重新执行失败任务。";
      try {
        const job = await api(
          `/api/workflows/${encodeURIComponent(retryableWorkflowId)}/retry`,
          requestOptions,
        );
        const run = await waitForJob(job.job_id);
        renderRun(run);
        if (run.workflow_id) await loadRun(run.workflow_id);
        await loadHistory();
        if (run.status !== "completed") {
          throw new Error(run.error || "任务重跑失败。");
        }
        message.dataset.state = "success";
        message.textContent = isOverride
          ? "人工覆盖重跑完成并已保存。"
          : "任务重跑完成并已保存。";
      } catch (error) {
        message.dataset.state = "error";
        message.textContent = error.message;
      } finally {
        retryButton.disabled = false;
      }
    });

    downloadButton.addEventListener("click", async () => {
      if (!downloadableWorkflowId) return;

      downloadButton.disabled = true;
      message.dataset.state = "";
      message.textContent = "正在准备 ZIP…";
      try {
        const response = await fetch(
          `/api/workflows/${encodeURIComponent(downloadableWorkflowId)}/download`,
        );
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || "下载失败。");
        }

        const url = URL.createObjectURL(await response.blob());
        const link = document.createElement("a");
        link.href = url;
        link.download = `landing-page-${downloadableWorkflowId}.zip`;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        message.dataset.state = "success";
        message.textContent = "网站 ZIP 已下载。";
      } catch (error) {
        message.dataset.state = "error";
        message.textContent = error.message;
      } finally {
        downloadButton.disabled = false;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const fieldNames = [
        "company_name", "target_customer", "core_service", "region",
        "language", "cta", "contact"
      ];
      const fields = fieldNames.map((name) => form.elements[name]);
      const payload = Object.fromEntries(
        fields.map((field) => [field.name, field.value.trim()])
      );
      for (const field of fields) {
        field.setAttribute("aria-invalid", String(!field.value.trim()));
      }
      if (Object.values(payload).some((value) => !value)) {
        message.dataset.state = "error";
        message.textContent = "请填写所有客户资料。";
        return;
      }

      retryableWorkflowId = null;
      retryOverrideRequired = false;
      retryButton.hidden = true;
      button.disabled = true;
      button.textContent = "执行中…";
      retryOverrideWarning = "";
      retryOverrideRiskLevel = "";
      retryButton.dataset.risk = "";
      message.dataset.state = "";
      message.textContent = "Agent 正在处理任务。";
      try {
        const job = await api("/api/workflows", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });
        message.textContent = "任务已进入后台执行，可继续打开网页查看状态。";
        const run = await waitForJob(job.job_id);
        renderRun(run);
        if (run.workflow_id) await loadRun(run.workflow_id);
        await loadHistory();
        if (run.status !== "completed") {
          throw new Error(run.error || "任务执行失败。");
        }
        message.dataset.state = "success";
        message.textContent = "任务已完成并保存到历史记录。";
      } catch (error) {
        renderLandingPagePreview(null);
        message.dataset.state = "error";
        message.textContent = error.message;
        statusDot.dataset.status = "failed";
      } finally {
        button.disabled = false;
        button.textContent = "开始执行";
      }
    });

    loadHistory();
  </script>
</body>
</html>
